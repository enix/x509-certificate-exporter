{{- if .Values.prometheusPodMonitor.create }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "x509-certificate-exporter.fullname" . }}-podmonitor
  namespace: {{ include "x509-certificate-exporter.namespace" . }}
  labels:
    {{- include "x509-certificate-exporter.labels" . | nindent 4 }}
    {{- with .Values.prometheusPodMonitor.extraLabels }}
    {{- . | toYaml | trim | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "x509-certificate-exporter.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
  - port: metrics
    interval: {{ .Values.prometheusPodMonitor.scrapeInterval }}
    scrapeTimeout: {{ .Values.prometheusPodMonitor.scrapeTimeout }}
    {{- if .Values.rbacProxy.enabled }}
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    {{- end }}
    scheme: {{ .Values.prometheusPodMonitor.scheme }}
    {{- if and .Values.rbacProxy.enabled .Values.prometheusPodMonitor.basicAuth }}
    {{- fail "prometheusPodMonitor.basicAuth cannot be combined with rbacProxy.enabled: kube-rbac-proxy authenticates scrapes with the Prometheus ServiceAccount bearer token, and a monitor endpoint must define a single authentication method" }}
    {{- end }}
    {{- if and .Values.prometheusPodMonitor.basicAuth (ne .Values.prometheusPodMonitor.scheme "https") }}
    {{- fail "prometheusPodMonitor.basicAuth requires scheme: https — scraping with credentials over plaintext HTTP would transmit them in cleartext" }}
    {{- end }}
    {{- with .Values.prometheusPodMonitor.basicAuth }}
    basicAuth:
    {{- . | toYaml | nindent 6 }}
    {{- end }}
    {{- with .Values.prometheusPodMonitor.tlsConfig }}
    tlsConfig:
    {{- . | toYaml | nindent 6 }}
    {{- end }}
    {{- with .Values.prometheusPodMonitor.metricRelabelings }}
    metricRelabelings:
    {{- . | toYaml | nindent 4 }}
    {{- end }}
    {{- with .Values.prometheusPodMonitor.relabelings }}
    relabelings:
    {{- . | toYaml | nindent 4 }}
    {{- end }}
{{- end }}
