name: Labeler

# Auto-applies path-based labels (defined in .github/labeler.yml) to every PR,
# refreshing on each push so a label that no longer applies gets removed (sync-
# labels: true). The "sensitive" label is the visibility complement to
# CODEOWNERS — both must remain in lock-step with each other.
#
# Permissions are scoped to what the action needs: read repo metadata, write
# PR labels.
#
# `pull_request_target`, not `pull_request`: on `pull_request` GitHub forces
# the token read-only for fork PRs, so labeling fails ("Resource not
# accessible by integration") on exactly the external PRs where `sensitive`
# matters most. `pull_request_target` runs in the base repo's context with a
# writable token, which is safe ONLY because this job never runs PR code:
# there is no checkout, labeler reads the changed-file list from the API, and
# both this workflow and .github/labeler.yml come from the base branch.
#
# Never add an actions/checkout of the PR head here, and never move a
# build/lint/test workflow to `pull_request_target`: that hands the writable
# token and the repo secrets (RENOVATE_APP_PRIVATE_KEY, …) to whoever opens
# the PR. Those workflows stay on `pull_request`, where read-only is all they
# need.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
