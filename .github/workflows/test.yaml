name: Tests

# Same shape as lint.yaml / security.yaml: scoped on PR via path
# detection, runs everything unconditionally when called from another
# workflow (e.g. release).
on:
  pull_request:
  workflow_call:
    inputs:
      skip-e2e:
        description: Skip the E2E suite.
        type: boolean
        default: false

# Read-only by default — every job here just runs the test suite. The
# release.yaml caller doesn't pass any privileged token through.
permissions:
  contents: read

# Silence Dagger's Cloud upload and analytics paths globally.
env:
  DAGGER_NO_NAG: "1"
  DAGGER_CLOUD_TOKEN: ""
  DO_NOT_TRACK: "1"

jobs:
  changes:
    name: Detect changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      e2e: ${{ steps.filter.outputs.e2e }}
      helm_examples: ${{ steps.filter.outputs.helm_examples }}
      helm_fixtures: ${{ steps.filter.outputs.helm_fixtures }}
      helm_render: ${{ steps.filter.outputs.helm_render }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Unit tests fire on any Go change; e2e additionally on
          # anything that materially affects the deployed flow — chart
          # templates, fixtures, the Tiltfile, and the seeders. Each job
          # also fires on the fixtures it consumes (testdata/,
          # test/render/, test/schema/) and on its own definition (this
          # file, the Dagger action, the Taskfile / dev shell it runs).
          filters: |
            go:
              - '**/*.go'
              - '**/testdata/**'
              - 'go.mod'
              - 'go.sum'
              - 'dagger/**'
              - '.github/actions/dagger/**'
              - '.github/workflows/test.yaml'
            fuzz:
              - '**/*.go'
              - '**/testdata/**'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/test.yaml'
            e2e:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'dagger/**'
              - 'chart/**'
              - 'dev/scenarios/**'
              - 'dev/seed/**'
              - 'dev/seed-hostpath/**'
              - 'dev/values.yaml'
              - 'test/e2e/**'
              - 'build/Dockerfile.*'
              - '.goreleaser.yaml'
              - 'flake.nix'
              - 'flake.lock'
              - 'Taskfile.yml'
              - '.github/workflows/test.yaml'
            helm_examples:
              - 'chart/**'
              - 'docs/examples/**'
              - 'dagger/**'
              - '.github/actions/dagger/**'
              - '.github/workflows/test.yaml'
            helm_fixtures:
              - 'chart/**'
              - 'test/schema/**'
              - 'dagger/**'
              - '.github/actions/dagger/**'
              - '.github/workflows/test.yaml'
            helm_render:
              - 'chart/**'
              - 'test/render/**'
              - 'dagger/**'
              - '.github/actions/dagger/**'
              - '.github/workflows/test.yaml'

  unit:
    name: Unit tests
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/dagger
        with:
          args: test

  fuzz:
    name: Fuzz smoke
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.fuzz == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      # Same dev shell as the E2E job, so `task test:fuzz` stays the one
      # place that lists the Fuzz* targets.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: nix develop --command task test:fuzz
      # A crash leaves its input under <pkg>/testdata/fuzz/<Fuzz*>/:
      # commit it with the fix, where it becomes a regression test.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  helm-examples:
    name: Helm examples
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.helm_examples == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/dagger
        with:
          args: test-helm-examples

  helm-fixtures:
    name: Helm schema fixtures
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.helm_fixtures == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/dagger
        with:
          args: test-helm-fixtures

  helm-render:
    name: Helm render
    needs: changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.helm_render == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/dagger
        with:
          args: test-helm-render

  e2e:
    name: E2E tests
    needs: changes
    if: |
      always() &&
      !inputs.skip-e2e &&
      (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      # Bring up the same toolset as the local dev shell — k3d, helm,
      # tilt, goreleaser, kubectl, task — from flake.nix. Single source
      # of truth between dev and CI for the e2e tooling. Renovate
      # tracks both refs via the `# vXX` comment.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: nix develop --command task test:e2e
